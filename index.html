<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>RPG NEXUS - 3D DICE GRID SYSTEM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg: #030305; --card: #0d0d16; --accent: #00f2ff; 
            --danger: #ff2e63; --success: #08f7af; --warn: #f39c12; --border: #1a1a2e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #e0e0e0; height: 100vh; display: flex; overflow: hidden; }

        /* CONTAINER PRINCIPAL COM MÚLTIPLAS PÁGINAS */
        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }
        
        /* PÁGINAS */
        .page {
            display: none;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        .page.active {
            display: flex;
        }
        
        /* HEADER COM NAVEGAÇÃO */
        .nav-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(3,3,5,0.95);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            gap: 20px;
            z-index: 1000;
            border-bottom: 1px solid var(--accent);
        }
        
        .nav-btn {
            background: none;
            border: none;
            color: #888;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
            border-radius: 8px;
        }
        
        .nav-btn:hover {
            color: var(--accent);
            background: rgba(0,242,255,0.1);
        }
        
        /* ARENA SELECTOR */
        .arena-selector {
            margin-top: 70px;
            padding: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .arena-card {
            background: #05050a;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #222;
            min-width: 180px;
        }
        
        .arena-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 5px 20px rgba(0,242,255,0.3);
        }
        
        .arena-card.active {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(0,242,255,0.1), rgba(0,0,0,0.5));
        }
        
        .arena-icon {
            font-size: 64px;
            margin-bottom: 10px;
        }
        
        .arena-name {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent);
            margin-top: 10px;
        }
        
        .arena-desc {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        
        /* CONTEÚDO DA ARENA */
        .arena-content {
            margin-top: 70px;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }
        
        .battle-area {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .combatant-card {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            width: 320px;
            text-align: center;
            border: 2px solid var(--border);
            transition: 0.3s;
        }
        
        .combatant-card.enemy {
            border-color: var(--danger);
        }
        
        .combatant-card.player {
            border-color: var(--success);
        }
        
        .combatant-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #00aaff);
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        
        .combatant-avatar img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .combatant-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .combatant-hp {
            background: #000;
            border-radius: 10px;
            height: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        
        .combatant-hp-bar {
            height: 100%;
            background: var(--success);
            width: 100%;
            transition: width 0.5s;
        }
        
        .combatant-hp-text {
            font-size: 14px;
            margin-top: 5px;
        }
        
        .combat-skills {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .combat-skill-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        
        .combat-skill-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 10px var(--accent);
        }
        
        .combat-log {
            background: #05050a;
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #222;
        }
        
        .combat-log-entry {
            padding: 8px;
            border-bottom: 1px solid #111;
            font-size: 12px;
        }
        
        .combat-log-entry.damage {
            color: var(--danger);
        }
        
        .combat-log-entry.heal {
            color: var(--success);
        }
        
        .combat-log-entry.victory {
            color: var(--success);
            font-weight: bold;
        }
        
        .back-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .heroes-select {
            background: var(--card);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .hero-select-btn {
            background: #05050a;
            border: 1px solid #333;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .hero-select-btn:hover {
            border-color: var(--accent);
            transform: scale(1.02);
        }
        
        .hero-select-btn.selected {
            border-color: var(--accent);
            background: rgba(0,242,255,0.2);
            color: var(--accent);
        }
        
        .hero-select-btn img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        .btn-primary {
            background: var(--accent);
            color: #000;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,242,255,0.4);
        }
        
        .btn-secondary {
            background: none;
            border: 1px solid var(--success);
            color: var(--success);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn-secondary:hover {
            background: var(--success);
            color: #000;
        }
        
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            padding: 10px 0;
        }
        
        .char-card { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 15px; 
            transition: 0.5s; 
            position: relative;
        }
        
        .char-card.dead { 
            filter: grayscale(0.7); 
            border-color: var(--danger); 
            opacity: 0.8;
        }
        
        .card-header { 
            padding: 15px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            cursor: pointer;
        }
        
        .img-thumb { 
            width: 60px; 
            height: 60px; 
            border-radius: 10px; 
            object-fit: cover; 
            border: 2px solid var(--accent); 
        }
        
        .bar-bg { 
            height: 14px; 
            background: #000; 
            border-radius: 7px; 
            margin-top: 5px; 
            border: 1px solid #333; 
            overflow: hidden; 
        }
        
        .bar-fill { 
            height: 100%; 
            background: var(--success); 
            width: 100%; 
            transition: width 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28); 
        }
        
        .card-content { 
            max-height: 0; 
            overflow: hidden; 
            transition: 0.5s ease; 
            padding: 0 20px; 
        }
        
        .char-card.expanded .card-content { 
            max-height: 3000px; 
            padding-bottom: 20px; 
        }
        
        .tab-bar { 
            display: flex; 
            gap: 10px; 
            margin: 15px 0; 
            border-bottom: 1px solid #222; 
        }
        
        .tab-btn { 
            background: none; 
            border: none; 
            color: #666; 
            cursor: pointer; 
            padding: 10px; 
            font-weight: bold; 
        }
        
        .tab-btn.active { 
            color: var(--accent); 
            border-bottom: 2px solid var(--accent); 
        }
        
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        .attr-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
        }
        
        .attr-item { 
            background: #000; 
            padding: 10px; 
            border-radius: 12px; 
            text-align: center; 
            position: relative;
        }
        
        .attr-mod { 
            position: absolute; 
            top: -5px; 
            right: -5px; 
            background: var(--accent); 
            color: #000; 
            padding: 2px 8px; 
            border-radius: 5px; 
            font-size: 12px; 
        }
        
        .list-item { 
            background: #05050a; 
            padding: 10px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            border-left: 3px solid var(--accent); 
        }
        
        .total-sum {
            background: linear-gradient(135deg, var(--accent), #00aaff);
            color: #000;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 20px;
        }
        
        .dice-grid { display: grid; gap: 12px; padding: 15px; min-height: 100%; }
        .dice-cell { aspect-ratio: 1; background: rgba(0,0,0,0.4); border-radius: 12px; position: relative; cursor: pointer; border: 1px solid rgba(0,242,255,0.3); }
        .dice-cell canvas { width: 100%; height: 100%; border-radius: 10px; }
        .dice-number-3d { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: 900; color: white; text-shadow: 0 0 20px black; background: rgba(0,0,0,0.6); padding: 6px 16px; border-radius: 40px; border: 2px solid; white-space: nowrap; }
        .dice-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .d-btn { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #000; }
        .dice-grid:has(.dice-cell:only-child) { display: flex; justify-content: center; align-items: center; }
        .dice-grid:has(.dice-cell:only-child) .dice-cell { width: 280px; height: 280px; margin: auto; }
        .clear-btn { color: var(--danger); cursor: pointer; }
        .log-entry { border-bottom: 1px solid #111; padding: 6px 0; display: flex; justify-content: space-between; }
        .empty-cell { display: flex; align-items: center; justify-content: center; color: #2a2a3a; background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px dashed #2a2a3a; }
        .skill-damage { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
        .use-skill-btn { background: var(--accent); color: #000; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .damage-preview { font-size: 12px; color: var(--success); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- PÁGINA PRINCIPAL (RPG) -->
        <div id="rpg-page" class="page active">
            <div style="display: flex; width: 100%;">
                <div id="hero-section" style="flex: 1; padding: 20px; overflow-y: auto;">
                    <div style="display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap;">
                        <button class="btn-primary" onclick="addNewHero()">
                            <i class="fas fa-plus"></i> NOVO PERSONAGEM
                        </button>
                        <button class="btn-secondary" onclick="saveAll()">
                            <i class="fas fa-save"></i> SALVAR SESSÃO
                        </button>
                        <button class="btn-secondary" onclick="loadAll()">
                            <i class="fas fa-folder-open"></i> CARREGAR
                        </button>
                        <button class="btn-secondary" onclick="openArena()">
                            <i class="fas fa-fist-raised"></i> IR PARA ARENAS
                        </button>
                    </div>
                    <div id="hero-list" class="hero-grid"></div>
                </div>

                <aside id="dice-panel" style="width: 650px; background: var(--card); border-left: 2px solid var(--accent); padding: 20px; display: flex; flex-direction: column; position: relative;">
                    <button class="toggle-btn" onclick="toggleDice()" style="position: absolute; left: -15px; top: 20px; width: 30px; height: 30px; background: var(--accent); color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none;">&lt;</button>
                    
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span style="color:var(--accent); font-weight:bold;"><i class="fas fa-cubes"></i> DADOS 3D</span>
                        <span class="total-sum" id="total-sum">Total: 0</span>
                    </div>
                    
                    <div class="dice-grid-container" id="dice-grid-container" style="width:100%; background: linear-gradient(135deg, #0a0a12 0%, #050508 100%); border-radius: 15px; border: 2px solid var(--accent); overflow: hidden; min-height: 450px; max-height: 550px;">
                        <div id="dice-grid" class="dice-grid"></div>
                    </div>
                    
                    <div class="dice-controls">
                        <button class="d-btn" style="background:#4ecca3" onclick="addDiceToGrid('d4', 4, '#4ecca3')">🎲 D4</button>
                        <button class="d-btn" style="background:#45b7d1" onclick="addDiceToGrid('d6', 6, '#45b7d1')">🎲 D6</button>
                        <button class="d-btn" style="background:#a29bfe" onclick="addDiceToGrid('d8', 8, '#a29bfe')">🎲 D8</button>
                        <button class="d-btn" style="background:#ff7675" onclick="addDiceToGrid('d10', 10, '#ff7675')">🎲 D10</button>
                        <button class="d-btn" style="background:#fdcb6e" onclick="addDiceToGrid('d12', 12, '#fdcb6e')">🎲 D12</button>
                        <button class="d-btn" style="background:#00f2ff" onclick="addDiceToGrid('d20', 20, '#00f2ff')">🎲 D20</button>
                    </div>
                    
                    <div style="display:flex; justify-content:space-between; font-size:12px; margin:10px 0; color:#888">
                        <span><i class="fas fa-history"></i> HISTÓRICO</span>
                        <span onclick="clearAllDice()" class="clear-btn">
                            <i class="fas fa-trash"></i> LIMPAR TUDO
                        </span>
                    </div>
                    <div id="dice-log" style="flex:1; overflow-y: auto; background: #05050a; border-radius: 8px; padding: 10px; border: 1px solid #1a1a1a; max-height: 180px;"></div>
                </aside>
            </div>
        </div>

        <!-- PÁGINA DE ARENAS -->
        <div id="arena-page" class="page">
            <div style="width: 100%; overflow-y: auto;">
                <div class="nav-header">
                    <button class="nav-btn" onclick="closeArena()">
                        <i class="fas fa-arrow-left"></i> VOLTAR
                    </button>
                    <span style="flex:1; text-align:center; color:var(--accent); font-size:18px;">
                        <i class="fas fa-fist-raised"></i> ARENAS RPG
                    </span>
                </div>

                <div id="arena-selector" class="arena-selector"></div>
                <div id="arena-content" class="arena-content"></div>
            </div>
        </div>
    </div>

    <audio id="death-sound" src="sino-2deg.mp3" preload="auto"></audio>

        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    
    // ==================== DADOS 3D ====================
    window.HeroState = {};
    window.heroAttributes = {};
    let diceGridData = [];
    let nextDiceId = 0;
    let scenes = new Map();
    
    const geos = {
        d4: new THREE.TetrahedronGeometry(0.9),
        d6: new THREE.BoxGeometry(1.0, 1.0, 1.0),
        d8: new THREE.OctahedronGeometry(0.85),
        d10: new THREE.IcosahedronGeometry(0.85, 0),
        d12: new THREE.DodecahedronGeometry(0.85),
        d20: new THREE.IcosahedronGeometry(0.9, 0)
    };
    
    function getAttributeModifier(attributeValue) {
        return Math.floor((parseInt(attributeValue) - 10) / 2);
    }
    
    window.calculateSkillDamage = (skillFormula, heroId) => {
        if (!heroId || !window.heroAttributes[heroId]) return 0;
        const attrs = window.heroAttributes[heroId];
        let formula = skillFormula;
        const replacements = {
            '{FOR}': attrs.for || 10, '{DES}': attrs.des || 10, '{CON}': attrs.con || 10,
            '{INT}': attrs.int || 10, '{SAB}': attrs.sab || 10, '{CAR}': attrs.car || 10,
            '{MOD_FOR}': getAttributeModifier(attrs.for || 10), '{MOD_DES}': getAttributeModifier(attrs.des || 10),
            '{MOD_CON}': getAttributeModifier(attrs.con || 10), '{MOD_INT}': getAttributeModifier(attrs.int || 10),
            '{MOD_SAB}': getAttributeModifier(attrs.sab || 10), '{MOD_CAR}': getAttributeModifier(attrs.car || 10)
        };
        for (const [key, value] of Object.entries(replacements)) formula = formula.split(key).join(value);
        try {
            const diceRegex = /(\d*)d(\d+)/gi;
            formula = formula.replace(diceRegex, (match, count, sides) => {
                const numDice = count === '' ? 1 : parseInt(count);
                let total = 0;
                for (let i = 0; i < numDice; i++) total += Math.floor(Math.random() * parseInt(sides)) + 1;
                return total;
            });
            return Math.max(0, Math.floor(eval(formula)));
        } catch (e) { return 0; }
    };
    
    window.useSkill = (heroId, skillName, skillFormula, targetHeroId = null) => {
        const damage = window.calculateSkillDamage(skillFormula, heroId);
        if (targetHeroId && window.HeroState[targetHeroId] !== undefined) {
            const newHP = Math.max(0, window.HeroState[targetHeroId] - damage);
            window.HeroState[targetHeroId] = newHP;
            window.updateHP(targetHeroId, true);
            const attackerName = document.getElementById(`tag-${heroId}`)?.innerText || heroId;
            const targetName = document.getElementById(`tag-${targetHeroId}`)?.innerText || targetHeroId;
            addCombatLog(`${attackerName} usou ${skillName}`, `${damage} de dano em ${targetName}`, 'damage');
        } else {
            addCombatLog(skillName, `${damage} de dano calculado`, 'damage');
        }
        return damage;
    };
    
    function addCombatLog(action, result, type = '') {
        const logDiv = document.getElementById('dice-log');
        if (logDiv) {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerHTML = `<span>${action}</span><b>${result}</b>`;
            logDiv.prepend(entry);
            while(logDiv.children.length > 50) logDiv.removeChild(logDiv.lastChild);
        }
    }
    
    window.addDiceToGrid = (type, sides, color) => {
        const result = Math.floor(Math.random() * sides) + 1;
        const newDice = { id: nextDiceId++, type, sides, color, value: result, isRolling: true, result };
        diceGridData.push(newDice);
        renderGrid();
        let frames = 0;
        const rollInterval = setInterval(() => {
            if (frames >= 32) {
                clearInterval(rollInterval);
                const dice = diceGridData.find(d => d.id === newDice.id);
                if (dice) {
                    dice.isRolling = false;
                    const sceneData = scenes.get(dice.id);
                    if (sceneData?.numberLabel) {
                        sceneData.numberLabel.innerText = dice.result;
                        sceneData.numberLabel.style.animation = 'numberPop 0.4s ease-out';
                    }
                    updateTotalSum();
                    addCombatLog(`d${dice.sides}`, dice.result, '');
                }
            } else {
                const randomVal = Math.floor(Math.random() * sides) + 1;
                const sceneData = scenes.get(newDice.id);
                if (sceneData?.numberLabel) sceneData.numberLabel.innerText = randomVal;
                frames++;
            }
        }, 38);
    };
    
    window.removeDice = (id) => {
        const sceneData = scenes.get(id);
        if (sceneData?.animationId) cancelAnimationFrame(sceneData.animationId);
        scenes.delete(id);
        diceGridData = diceGridData.filter(d => d.id !== id);
        renderGrid();
        updateTotalSum();
    };
    
    function updateTotalSum() {
        const total = diceGridData.reduce((sum, dice) => sum + (dice.value || 0), 0);
        const totalEl = document.getElementById('total-sum');
        if (totalEl) totalEl.innerHTML = `Total: ${total}`;
    }
    
    window.clearAllDice = () => {
        scenes.forEach((scene, id) => { if (scene.animationId) cancelAnimationFrame(scene.animationId); });
        scenes.clear();
        diceGridData = [];
        renderGrid();
        updateTotalSum();
        const logDiv = document.getElementById('dice-log');
        if (logDiv) logDiv.innerHTML = '';
    };
    
    window.toggleDice = () => {
        const p = document.getElementById('dice-panel');
        if (p) {
            p.classList.toggle('minimized');
            const btn = p.querySelector('.toggle-btn');
            if (btn) btn.innerHTML = p.classList.contains('minimized') ? '>' : '<';
        }
    };
    
    function renderGrid() {
        const gridContainer = document.getElementById('dice-grid');
        if (!gridContainer) return;
        const count = diceGridData.length;
        if (count === 0) {
            gridContainer.innerHTML = '<div class="empty-cell" style="grid-column:1/-1; display:flex; align-items:center; justify-content:center; min-height:400px;"><div style="text-align:center;"><i class="fas fa-dice-d20" style="font-size:64px; color:#2a2a3a;"></i><p style="color:#666;">Clique nos dados acima</p></div></div>';
            return;
        }
        if (count === 1) {
            gridContainer.style.display = 'flex';
            gridContainer.style.justifyContent = 'center';
            gridContainer.style.alignItems = 'center';
            const dice = diceGridData[0];
            gridContainer.innerHTML = `<div class="dice-cell ${dice.isRolling ? 'rolling' : ''}" data-id="${dice.id}" id="dice-cell-${dice.id}" style="width:280px; height:280px; margin:auto;" onclick="removeDice(${dice.id})"></div>`;
        } else {
            const cols = count <= 2 ? count : (count <= 4 ? 2 : (count <= 6 ? 3 : (count <= 9 ? 3 : 4)));
            const rows = Math.ceil(count / cols);
            gridContainer.style.display = 'grid';
            gridContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            let html = '';
            for (let i = 0; i < cols * rows; i++) {
                const dice = diceGridData[i];
                if (dice) html += `<div class="dice-cell ${dice.isRolling ? 'rolling' : ''}" data-id="${dice.id}" id="dice-cell-${dice.id}" onclick="removeDice(${dice.id})"></div>`;
                else html += `<div class="empty-cell"><i class="fas fa-circle"></i></div>`;
            }
            gridContainer.innerHTML = html;
        }
        diceGridData.forEach(dice => {
            const cell = document.getElementById(`dice-cell-${dice.id}`);
            if (cell) initDice3D(`dice-cell-${dice.id}`, dice);
        });
    }
    
    function initDice3D(cellId, dice) {
        const container = document.getElementById(cellId);
        if (!container) return;
        container.innerHTML = '';
        const canvas = document.createElement('canvas');
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        container.appendChild(canvas);
        const width = container.clientWidth, height = container.clientHeight;
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(width, height);
        renderer.setClearColor(0x0a0a12, 0);
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, width/height, 0.1, 100);
        camera.position.set(1.5, 1.5, 2.2);
        camera.lookAt(0,0,0);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(2,3,2);
        scene.add(mainLight);
        const material = new THREE.MeshStandardMaterial({ color: dice.color, roughness: 0.25, metalness: 0.15, emissive: dice.color, emissiveIntensity: 0.08 });
        const diceMesh = new THREE.Mesh(geos[dice.type], material);
        scene.add(diceMesh);
        let numberLabel = null;
        if (dice.value) {
            numberLabel = document.createElement('div');
            numberLabel.className = 'dice-number-3d';
            numberLabel.innerText = dice.value;
            numberLabel.style.borderColor = dice.color;
            numberLabel.style.color = dice.color;
            container.appendChild(numberLabel);
        }
        let rotX=0, rotY=0, rotZ=0;
        function animate() {
            if (dice.isRolling) {
                rotX += 0.12; rotY += 0.15; rotZ += 0.08;
                diceMesh.rotation.set(rotX, rotY, rotZ);
            }
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();
        scenes.set(dice.id, { numberLabel });
    }

            const choice = prompt(`Escolha o alvo:\n${targetList}\n\nDigite o número:`);
            if (choice && !isNaN(choice)) {
                const idx = parseInt(choice)-1;
                if (targetOptions[idx]) {
                    const damage = window.useSkill(heroId, skillName, formula, targetOptions[idx].id);
                    alert(`${skillName} causou ${damage} de dano em ${targetOptions[idx].name}!`);
                    return;

    window.updateHP = (id, playSound = true) => {
        const max = parseInt(document.getElementById(`max-${id}`).value) || 1;
        let cur = window.HeroState[id];
        if(cur > max) cur = max;
        const pct = (cur / max) * 100;
        const barFill = document.getElementById(`bar-${id}`);
        if(barFill) barFill.style.width = Math.max(0, pct) + "%";
        const txtSpan = document.getElementById(`txt-${id}`);
        if(txtSpan) txtSpan.innerText = `${cur} / ${max}`;
        const card = document.getElementById(id);
        if(cur <= 0 && !card.classList.contains('dead')) {
            card.classList.add('dead');
            if(playSound) document.getElementById('death-sound').play().catch(()=>{});
        } else if(cur > 0) card.classList.remove('dead');
    };
    
    window.calcAttr = (id) => {
        const card = document.getElementById(id);
        const bases = card.querySelectorAll('.i-attr');
        const bonus = card.querySelectorAll('.i-rb');
        const labels = ['FOR','DES','CON','INT','SAB','CAR'];
        bases.forEach((el, i) => {
            const total = (parseInt(el.value) || 0) + (parseInt(bonus[i].value) || 0);
            const mod = Math.floor((total - 10) / 2);
            document.getElementById(`mod-${labels[i]}-${id}`).innerText = (mod >= 0 ? "+" : "") + mod;
            window.heroAttributes[id][labels[i].toLowerCase()] = total;
        });
        document.querySelectorAll(`#skill-list-${id} .list-item`).forEach(skill => window.updateSkillPreview(id, skill));
    };
    
    window.combat = (e, id) => {
        if(e.key === 'Enter') {
            let v = e.target.value.trim();
            let c = window.HeroState[id];
            if(v.startsWith('+') || v.startsWith('-')) c += parseInt(v) || 0;
            else c = parseInt(v) || c;
            window.HeroState[id] = c;
            window.updateHP(id, true);
            e.target.value = "";
        }
    };

        }
        const damage = window.calculateSkillDamage(formula, heroId);
        currentBoss.currentHp = Math.max(0, currentBoss.currentHp - damage);
        updateBossHp();
        addArenaLog(`⚔️ ${getHeroName(heroId)} usou ${skillName} e causou ${damage} de dano em ${currentArena.boss.name}!`, 'damage');

        const heroHp = window.HeroState[selectedHero];
        if (heroHp <= 0) {
            addArenaLog(`💀 ${getHeroName(selectedHero)} já está derrotado!`, 'damage');
            return;
        }
        const damage = Math.floor(Math.random() * 20) + 10;
        const newHp = Math.max(0, heroHp - damage);
        window.HeroState[selectedHero] = newHp;
        window.updateHP(selectedHero, true);
        addArenaLog(`😈 ${currentArena.boss.name} usou ${skillName} e causou ${damage} de dano em ${getHeroName(selectedHero)}!`, 'damage');
        
        if (newHp <= 0) {

        }
    };
    
    function updateBossHp() {
        const bar = document.getElementById('boss-hp-bar');
        const text = document.getElementById('boss-hp-text');
        if (bar) bar.style.width = `${(currentBoss.currentHp / currentBoss.maxHp) * 100}%`;
        if (text) text.innerText = currentBoss.currentHp;
    }
    
    function addArenaLog(message, type = '') {
        const logDiv = document.getElementById('arena-log');
        if (logDiv) {
            const entry = document.createElement('div');
            entry.className = `combat-log-entry ${type}`;
            entry.innerHTML = `<i class="fas ${type === 'victory' ? 'fa-trophy' : (type === 'heal' ? 'fa-star' : 'fa-skull')}"></i> ${message}`;
            logDiv.prepend(entry);
            while(logDiv.children.length > 50) logDiv.removeChild(logDiv.lastChild);
        }
    }
    
    function getHeroName(heroId) {
        const card = document.getElementById(heroId);
        return card?.querySelector('.i-name')?.value || heroId;
    }
    
    window.backToArenaSelect = () => {
        currentArena = null;
        selectedHero = null;
        currentBoss = null;
        renderArenas();
        const content = document.getElementById('arena-content');
        if (content) content.innerHTML = '<div style="text-align: center; padding: 100px 20px;"><i class="fas fa-dragon" style="font-size: 80px; color: var(--accent); margin-bottom: 20px;"></i><p style="color:#888;">Selecione uma arena acima para começar o combate!</p></div>';
    };
    
    window.openArena = () => {
        document.getElementById('rpg-page').classList.remove('active');
        document.getElementById('arena-page').classList.add('active');
        renderArenas();
    };
    
    window.closeArena = () => {
        document.getElementById('rpg-page').classList.add('active');
        document.getElementById('arena-page').classList.remove('active');
        backToArenaSelect();
    };
    
    // Inicialização
    renderGrid();
    const saved = localStorage.getItem('nexus_arena_v2');
    if(saved) JSON.parse(saved).reverse().forEach(d => addNewHero(d));
    else addNewHero();
</script>
</body>
</html>
