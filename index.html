<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>RPG NEXUS - 3D DICE GRID SYSTEM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --bg: #030305; --card: #0d0d16; --accent: #00f2ff; 
            --danger: #ff2e63; --success: #08f7af; --warn: #f39c12; --border: #1a1a2e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #e0e0e0; height: 100vh; display: flex; overflow: hidden; }

        #hero-section { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            transition: 0.4s; 
        }

        /* GRADE DE PERSONAGENS */
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            padding: 10px 0;
        }

        /* PAINEL DE DADOS COM GRADE DINÂMICA 3D */
        #dice-panel { 
            width: 650px;
            background: var(--card); 
            border-left: 2px solid var(--accent); 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            transition: 0.4s;
            position: relative;
        }
        #dice-panel.minimized { width: 45px; padding: 10px 5px; }
        #dice-panel.minimized > *:not(.toggle-btn) { display: none; }
        .toggle-btn { 
            position: absolute; 
            left: -15px; 
            top: 20px; 
            width: 30px; 
            height: 30px; 
            background: var(--accent); 
            color: #000; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 100; 
            border: none; 
            font-weight: bold; 
        }

        /* GRADE DE DADOS 3D DINÂMICA */
        .dice-grid-container {
            width: 100%;
            background: linear-gradient(135deg, #0a0a12 0%, #050508 100%);
            border-radius: 15px;
            border: 2px solid var(--accent);
            overflow: hidden;
            position: relative;
            min-height: 450px;
            max-height: 550px;
            box-shadow: 0 0 30px rgba(0,242,255,0.2);
        }
        
        .dice-grid {
            display: grid;
            gap: 12px;
            padding: 15px;
            min-height: 100%;
        }
        
        .dice-cell {
            aspect-ratio: 1 / 1;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(0,242,255,0.3);
            max-width: 100%;
            max-height: 100%;
        }
        
        .dice-grid:has(.dice-cell:only-child) {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .dice-grid:has(.dice-cell:only-child) .dice-cell {
            width: 280px;
            height: 280px;
            margin: auto;
        }
        
        .dice-cell:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0,242,255,0.5);
            border-color: var(--accent);
        }
        
        .dice-cell canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 10px;
        }
        
        .dice-number-3d {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(24px, 5vw, 48px);
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 10px currentColor;
            z-index: 10;
            pointer-events: none;
            font-family: monospace;
            background: rgba(0,0,0,0.6);
            padding: 6px 16px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            border: 2px solid;
            white-space: nowrap;
            animation: numberPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        @keyframes numberPop {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); opacity: 0; }
            60% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
        }
        
        .dice-cell.rolling {
            animation: diceShake 0.08s ease-in-out infinite;
        }
        
        @keyframes diceShake {
            0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
            25% { transform: translateX(-3px) translateY(-2px) rotate(-5deg); }
            75% { transform: translateX(3px) translateY(2px) rotate(5deg); }
        }
        
        .dice-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 15px 0;
        }
        
        .d-btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            font-size: 14px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .d-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .d-btn:active {
            transform: translateY(0);
        }

        #dice-log { 
            flex: 1; 
            overflow-y: auto; 
            background: #05050a; 
            border-radius: 8px; 
            padding: 10px; 
            border: 1px solid #1a1a1a; 
            font-size: 13px; 
            margin-top: 10px; 
            max-height: 180px;
        }
        .log-entry { 
            border-bottom: 1px solid #111; 
            padding: 6px 0; 
            display: flex; 
            justify-content: space-between;
            font-size: 13px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* CARDS & MORTE */
        .char-card { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 15px; 
            transition: 0.5s; 
            position: relative;
        }
        .char-card.dead { 
            filter: grayscale(0.7); 
            border-color: var(--danger); 
            box-shadow: 0 0 20px rgba(255, 46, 99, 0.3);
            opacity: 0.8;
        }
        .char-card.dead::before { 
            content: "☠️ MORTO ☠️"; 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            font-size: 12px; 
            z-index: 5;
            background: rgba(0,0,0,0.7);
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
            color: var(--danger);
        }
        
        .card-header { 
            padding: 15px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            cursor: pointer;
            transition: 0.3s;
        }
        .card-header:hover {
            background: rgba(0,242,255,0.05);
        }
        .img-thumb { 
            width: 60px; 
            height: 60px; 
            border-radius: 10px; 
            object-fit: cover; 
            border: 2px solid var(--accent); 
        }
        
        .bar-bg { 
            height: 14px; 
            background: #000; 
            border-radius: 7px; 
            margin-top: 5px; 
            border: 1px solid #333; 
            overflow: hidden; 
        }
        .bar-fill { 
            height: 100%; 
            background: var(--success); 
            width: 100%; 
            transition: width 0.8s cubic-bezier(0.18, 0.89, 0.32, 1.28), background-color 0.5s; 
        }

        .card-content { 
            max-height: 0; 
            overflow: hidden; 
            transition: 0.5s ease; 
            padding: 0 20px; 
        }
        .char-card.expanded { 
            border-color: var(--accent); 
            box-shadow: 0 0 20px rgba(0,242,255,0.2);
        }
        .char-card.expanded .card-content { 
            max-height: 3000px; 
            padding-bottom: 20px; 
        }

        .tab-bar { 
            display: flex; 
            gap: 10px; 
            margin: 15px 0; 
            border-bottom: 1px solid #222; 
            overflow-x: auto; 
        }
        .tab-btn { 
            background: none; 
            border: none; 
            color: #666; 
            cursor: pointer; 
            padding: 10px; 
            font-weight: bold; 
            font-size: 11px; 
            white-space: nowrap;
        }
        .tab-btn.active { 
            color: var(--accent); 
            border-bottom: 2px solid var(--accent); 
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }

        input, textarea, select { 
            background: #05050a; 
            border: 1px solid #333; 
            color: #fff; 
            padding: 8px; 
            border-radius: 6px; 
            outline: none; 
            width: 100%; 
        }
        input:focus { border-color: var(--accent); }

        .attr-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 12px; 
        }
        .attr-item { 
            background: #000; 
            padding: 10px; 
            border-radius: 12px; 
            border: 1px solid #222; 
            text-align: center; 
            position: relative;
        }
        .attr-mod { 
            position: absolute; 
            top: -5px; 
            right: -5px; 
            background: var(--accent); 
            color: #000; 
            padding: 2px 8px; 
            border-radius: 5px; 
            font-size: 12px; 
            font-weight: 900; 
        }
        
        .list-item { 
            background: #05050a; 
            padding: 10px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            border: 1px solid #222; 
            border-left: 3px solid var(--accent); 
        }
        
        .skill-damage {
            font-size: 11px;
            color: var(--danger);
            margin-top: 8px;
            padding-top: 5px;
            border-top: 1px solid #222;
        }
        
        .use-skill-btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
            margin-top: 8px;
            transition: 0.2s;
        }
        
        .use-skill-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--accent);
        }

        .total-sum {
            background: linear-gradient(135deg, var(--accent), #00aaff);
            color: #000;
            padding: 8px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 20px;
            text-align: center;
            display: inline-block;
            box-shadow: 0 0 20px rgba(0,242,255,0.5);
        }
        
        .btn-primary {
            background: var(--accent);
            color: #000;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,242,255,0.4);
        }
        
        .btn-secondary {
            background: none;
            border: 1px solid var(--success);
            color: var(--success);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-secondary:hover {
            background: var(--success);
            color: #000;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #05050a;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 4px;
        }
        
        .empty-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2a2a3a;
            font-size: 32px;
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            border: 1px dashed #2a2a3a;
        }
        
        .clear-btn {
            color: var(--danger);
            cursor: pointer;
            transition: 0.3s;
        }
        .clear-btn:hover {
            text-shadow: 0 0 10px var(--danger);
        }
        
        .damage-preview {
            font-size: 12px;
            color: var(--success);
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <audio id="death-sound" src="sino-2deg.mp3" preload="auto"></audio>

    <div id="hero-section">
        <div style="display:flex; gap:15px; margin-bottom:20px; flex-wrap:wrap;">
            <button class="btn-primary" onclick="addNewHero()">
                <i class="fas fa-plus"></i> NOVO PERSONAGEM
            </button>
            <button class="btn-secondary" onclick="saveAll()">
                <i class="fas fa-save"></i> SALVAR SESSÃO
            </button>
            <button class="btn-secondary" onclick="loadAll()">
                <i class="fas fa-folder-open"></i> CARREGAR
            </button>
             <button class="btn-secondary">
                <i class="fas fa-folder-open"></i> IR PARA ARENA
            </button>
        </div>
        <div id="hero-list" class="hero-grid"></div>
    </div>

    <aside id="dice-panel">
        <button class="toggle-btn" onclick="toggleDice()"> &lt; </button>
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span style="color:var(--accent); font-weight:bold;"><i class="fas fa-cubes"></i> DADOS 3D</span>
            <span class="total-sum" id="total-sum">Total: 0</span>
        </div>
        
        <div class="dice-grid-container" id="dice-grid-container">
            <div id="dice-grid" class="dice-grid"></div>
        </div>
        
        <div class="dice-controls">
            <button class="d-btn" style="background:#4ecca3" onclick="addDiceToGrid('d4', 4, '#4ecca3')">🎲 D4</button>
            <button class="d-btn" style="background:#45b7d1" onclick="addDiceToGrid('d6', 6, '#45b7d1')">🎲 D6</button>
            <button class="d-btn" style="background:#a29bfe" onclick="addDiceToGrid('d8', 8, '#a29bfe')">🎲 D8</button>
            <button class="d-btn" style="background:#ff7675" onclick="addDiceToGrid('d10', 10, '#ff7675')">🎲 D10</button>
            <button class="d-btn" style="background:#fdcb6e" onclick="addDiceToGrid('d12', 12, '#fdcb6e')">🎲 D12</button>
            <button class="d-btn" style="background:#00f2ff" onclick="addDiceToGrid('d20', 20, '#00f2ff')">🎲 D20</button>
        </div>
        
        <div style="display:flex; justify-content:space-between; font-size:12px; margin:10px 0; color:#888">
            <span><i class="fas fa-history"></i> HISTÓRICO</span>
            <span onclick="clearAllDice()" class="clear-btn">
                <i class="fas fa-trash"></i> LIMPAR TUDO
            </span>
        </div>
        <div id="dice-log"></div>
    </aside>

<script type="importmap">

        "imports": {
            "three": "https://unpkg.com/three@0.150.1/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    
    // Gerenciador de estado
    window.HeroState = {};
    
    // Armazenar atributos dos personagens para cálculo de dano
    window.heroAttributes = {};
    
    // Sistema de Grade 3D de Dados
    let diceGridData = [];
    let nextDiceId = 0;
    let scenes = new Map();
    
    // Geometrias dos dados
    const geos = {
        d4: new THREE.TetrahedronGeometry(0.9),
        d6: new THREE.BoxGeometry(1.0, 1.0, 1.0),
        d8: new THREE.OctahedronGeometry(0.85),
        d10: new THREE.IcosahedronGeometry(0.85, 0),
        d12: new THREE.DodecahedronGeometry(0.85),
        d20: new THREE.IcosahedronGeometry(0.9, 0)
    };
    
    // Função para calcular o modificador de um atributo
    function getAttributeModifier(attributeValue) {
        return Math.floor((parseInt(attributeValue) - 10) / 2);
    }
    
    // Função para calcular dano baseado na fórmula
    window.calculateSkillDamage = (skillFormula, heroId) => {
        if (!heroId || !window.heroAttributes[heroId]) return 0;
        
        const attrs = window.heroAttributes[heroId];
        let formula = skillFormula;
        
        // Substitui os placeholders pelos valores dos atributos
        const replacements = {
            '{FOR}': attrs.for || 10,
            '{DES}': attrs.des || 10,
            '{CON}': attrs.con || 10,
            '{INT}': attrs.int || 10,
            '{SAB}': attrs.sab || 10,
            '{CAR}': attrs.car || 10,
            '{MOD_FOR}': getAttributeModifier(attrs.for || 10),
            '{MOD_DES}': getAttributeModifier(attrs.des || 10),
            '{MOD_CON}': getAttributeModifier(attrs.con || 10),
            '{MOD_INT}': getAttributeModifier(attrs.int || 10),
            '{MOD_SAB}': getAttributeModifier(attrs.sab || 10),
            '{MOD_CAR}': getAttributeModifier(attrs.car || 10)
        };
        
        for (const [key, value] of Object.entries(replacements)) {
            formula = formula.split(key).join(value);
        }
        
        // Avalia a fórmula matemática
        try {
            // Avalia expressões como "2d6+5" ou "1d8+MOD_FOR"
            const diceRegex = /(\d*)d(\d+)/gi;
            let hasDice = false;
            
            formula = formula.replace(diceRegex, (match, count, sides) => {
                hasDice = true;
                const numDice = count === '' ? 1 : parseInt(count);
                let total = 0;
                for (let i = 0; i < numDice; i++) {
                    total += Math.floor(Math.random() * parseInt(sides)) + 1;
                }
                return total;
            });
            
            if (hasDice) {
                // Se tem dados, calcula o resultado
                const result = eval(formula);
                return Math.max(0, Math.floor(result));
            } else {
                // Se não tem dados, retorna o valor calculado
                const result = eval(formula);
                return Math.max(0, Math.floor(result));
            }
        } catch (e) {
            console.error('Erro ao calcular dano:', e);
            return 0;
        }
    };
    
    // Função para usar uma skill
    window.useSkill = (heroId, skillName, skillFormula, targetHeroId = null) => {
        const damage = window.calculateSkillDamage(skillFormula, heroId);
        
        // Se tiver um alvo, aplica o dano
        if (targetHeroId && window.HeroState[targetHeroId] !== undefined) {
            const currentHP = window.HeroState[targetHeroId];
            const newHP = currentHP - damage;
            window.HeroState[targetHeroId] = newHP;
            window.updateHP(targetHeroId, true);
            
            // Adiciona ao log
            const attackerName = document.getElementById(`tag-${heroId}`)?.innerText || heroId;
            const targetName = document.getElementById(`tag-${targetHeroId}`)?.innerText || targetHeroId;
            addCombatLog(attackerName, skillName, damage, targetName);
        } else {
            // Apenas mostra o dano calculado
            addCombatLog(null, skillName, damage, null);
        }
        
        return damage;
    };
    
    function addCombatLog(attacker, skill, damage, target) {
        const logDiv = document.getElementById('dice-log');
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        if (attacker && target) {
            entry.innerHTML = `<span><i class="fas fa-fist-raised"></i> ${attacker} usou ${skill}</span><b style="color:var(--danger);">${damage} de dano em ${target}</b>`;
        } else {
            entry.innerHTML = `<span><i class="fas fa-magic"></i> ${skill}</span><b style="color:var(--accent);">${damage} de dano calculado</b>`;
        }
        logDiv.prepend(entry);
        
        while(logDiv.children.length > 50) {
            logDiv.removeChild(logDiv.lastChild);
        }
    }
    
    // Função para criar uma skill com cálculo automático
    window.addSkillWithDamage = (id, n = "", formula = "1d6+{MOD_FOR}", t = "Ativa", d = "") => {
        const div = document.createElement('div');
        div.className = 'list-item';
        div.setAttribute('data-skill-formula', formula);
        
        // Obtém os atributos atuais do personagem
        const attrs = window.heroAttributes[id] || { for: 10, des: 10, con: 10, int: 10, sab: 10, car: 10 };
        
        // Calcula dano atual para preview
        const calculateCurrentDamage = () => {
            let tempFormula = formula;
            const modFor = getAttributeModifier(attrs.for);
            const modDes = getAttributeModifier(attrs.des);
            const modCon = getAttributeModifier(attrs.con);
            const modInt = getAttributeModifier(attrs.int);
            const modSab = getAttributeModifier(attrs.sab);
            const modCar = getAttributeModifier(attrs.car);
            
            tempFormula = tempFormula.replace(/{MOD_FOR}/g, modFor);
            tempFormula = tempFormula.replace(/{MOD_DES}/g, modDes);
            tempFormula = tempFormula.replace(/{MOD_CON}/g, modCon);
            tempFormula = tempFormula.replace(/{MOD_INT}/g, modInt);
            tempFormula = tempFormula.replace(/{MOD_SAB}/g, modSab);
            tempFormula = tempFormula.replace(/{MOD_CAR}/g, modCar);
            tempFormula = tempFormula.replace(/{FOR}/g, attrs.for);
            tempFormula = tempFormula.replace(/{DES}/g, attrs.des);
            tempFormula = tempFormula.replace(/{CON}/g, attrs.con);
            tempFormula = tempFormula.replace(/{INT}/g, attrs.int);
            tempFormula = tempFormula.replace(/{SAB}/g, attrs.sab);
            tempFormula = tempFormula.replace(/{CAR}/g, attrs.car);
            
            try {
                const diceRegex = /(\d*)d(\d+)/gi;
                let tempResult = tempFormula;
                tempResult = tempResult.replace(diceRegex, (match, count, sides) => {
                    const numDice = count === '' ? 1 : parseInt(count);
                    let total = 0;
                    for (let i = 0; i < numDice; i++) {
                        total += Math.floor(Math.random() * parseInt(sides)) + 1;
                    }
                    return total;
                });
                const result = eval(tempResult);
                return Math.max(0, Math.floor(result));
            } catch (e) {
                return 0;
            }
        };
        
        const updatePreview = () => {
            const previewSpan = div.querySelector('.damage-preview');
            if (previewSpan) {
                const previewDamage = calculateCurrentDamage();
                previewSpan.innerHTML = `🎲 Dano: ${previewDamage}`;
            }
        };
        
        div.innerHTML = `
            <div style="display:flex; gap:5px; margin-bottom:5px; flex-wrap:wrap;">
                <input placeholder="Nome do Poder" value="${n}" class="s-n" style="flex:2" onchange="updateSkillFormula('${id}', this.parentElement.parentElement)">
                <input placeholder="Fórmula (ex: 2d6+{MOD_FOR})" value="${formula}" class="s-formula" style="flex:2" onchange="updateSkillFormula('${id}', this.parentElement.parentElement)">
                <select class="s-t" style="flex:1"><option ${t=='Ativa'?'selected':''}>⚡ Ativa</option><option ${t=='Passiva'?'selected':''}>🛡️ Passiva</option></select>
                <button onclick="this.parentElement.parentElement.remove()" style="color:var(--danger); background:none; border:none; cursor:pointer; font-size:18px;">&times;</button>
            </div>
            <textarea placeholder="Descrição do poder..." class="s-d" style="min-height:40px; font-size:11px">${d}</textarea>
            <div class="skill-damage">

    // Inicializa cena 3D para um dado
    function initDice3D(cellId, dice) {
        const container = document.getElementById(cellId);
        if (!container) return;
        
        container.innerHTML = '';
        
        const canvas = document.createElement('canvas');
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.style.display = 'block';
        container.appendChild(canvas);
        
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
        renderer.setSize(width, height);
        renderer.setClearColor(0x0a0a12, 0);
        renderer.shadowMap.enabled = true;
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
        camera.position.set(1.5, 1.5, 2.2);
        camera.lookAt(0, 0, 0);
        
        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(2, 3, 2);
        mainLight.castShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x4466ff, 0.4);
        fillLight.position.set(-1.5, 1, 2);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xffaa66, 0.3);
        backLight.position.set(0, 1.5, -2.5);
        scene.add(backLight);
        
        const rimLight = new THREE.PointLight(0xff66aa, 0.3);
        rimLight.position.set(1.5, 1, -2);
        scene.add(rimLight);
        
        // Cria o dado
        const material = new THREE.MeshStandardMaterial({
            color: dice.color,
            roughness: 0.25,
            metalness: 0.15,
            emissive: dice.color,
            emissiveIntensity: 0.08
        });
        const diceMesh = new THREE.Mesh(geos[dice.type], material);
        diceMesh.castShadow = true;
        diceMesh.receiveShadow = true;
        scene.add(diceMesh);
        
        // Número flutuante
        let numberLabel = null;
        if (dice.value) {
            numberLabel = document.createElement('div');
            numberLabel.className = 'dice-number-3d';
            numberLabel.innerText = dice.value;
            numberLabel.style.borderColor = dice.color;
            numberLabel.style.color = dice.color;
            container.appendChild(numberLabel);
        }
        
        let animationId = null;
        let rotX = 0, rotY = 0, rotZ = 0;
        
        function animate() {
            if (dice.isRolling) {
                rotX += 0.12;
                rotY += 0.15;
                rotZ += 0.08;
                diceMesh.rotation.x = rotX;
                diceMesh.rotation.y = rotY;
                diceMesh.rotation.z = rotZ;
            }
            renderer.render(scene, camera);
            animationId = requestAnimationFrame(animate);
        }
        
        animate();
        
        scenes.set(dice.id, {
            scene, camera, renderer, diceMesh, animationId, numberLabel, container, rotX, rotY, rotZ
        });
        
        const resizeObserver = new ResizeObserver(() => {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            renderer.setSize(newWidth, newHeight);
            camera.aspect = newWidth / newHeight;
            camera.updateProjectionMatrix();
        });
        resizeObserver.observe(container);
    }
    
    // Calcula layout da grade
    function calculateGridLayout(count) {
        if (count === 0) return { cols: 1, rows: 0 };
        if (count === 1) return { cols: 1, rows: 1 };
        if (count === 2) return { cols: 2, rows: 1 };
        if (count === 3) return { cols: 3, rows: 1 };
        if (count === 4) return { cols: 2, rows: 2 };
        if (count <= 6) return { cols: 3, rows: 2 };
        if (count <= 9) return { cols: 3, rows: 3 };
        if (count <= 12) return { cols: 4, rows: 3 };
        if (count <= 16) return { cols: 4, rows: 4 };
        if (count <= 20) return { cols: 5, rows: 4 };
        return { cols: Math.ceil(Math.sqrt(count)), rows: Math.ceil(count / Math.ceil(Math.sqrt(count))) };
    }
    
    // Renderiza grade
    function renderGrid() {
        const gridContainer = document.getElementById('dice-grid');
        const count = diceGridData.length;
        const layout = calculateGridLayout(count);
        
        if (count === 0) {
            gridContainer.innerHTML = '<div class="empty-cell" style="grid-column:1/-1; display:flex; align-items:center; justify-content:center; min-height:400px;"><div style="text-align:center;"><i class="fas fa-dice-d20" style="font-size:64px; margin-bottom:15px; color:#2a2a3a;"></i><p style="color:#666;">Clique nos dados acima<br>para adicionar à mesa 3D</p></div></div>';
            gridContainer.style.gridTemplateColumns = '1fr';
            gridContainer.style.gridTemplateRows = '1fr';
            return;
        }
        
        if (count === 1) {
            gridContainer.style.display = 'flex';
            gridContainer.style.justifyContent = 'center';
            gridContainer.style.alignItems = 'center';
            gridContainer.style.minHeight = '400px';
        } else {
            gridContainer.style.display = 'grid';
            gridContainer.style.gridTemplateColumns = `repeat(${layout.cols}, 1fr)`;
            gridContainer.style.gridTemplateRows = `repeat(${layout.rows}, 1fr)`;
            gridContainer.style.minHeight = 'auto';
        }
        
        const totalCells = layout.cols * layout.rows;
        let html = '';
        
        if (count === 1) {
            const dice = diceGridData[0];
            html = `<div class="dice-cell ${dice.isRolling ? 'rolling' : ''}" data-id="${dice.id}" id="dice-cell-${dice.id}" style="width:280px; height:280px; margin:auto;" onclick="removeDice(${dice.id})"></div>`;
        } else {
            for (let i = 0; i < totalCells; i++) {
                const dice = diceGridData[i];
                if (dice) {
                    html += `<div class="dice-cell ${dice.isRolling ? 'rolling' : ''}" data-id="${dice.id}" id="dice-cell-${dice.id}" onclick="removeDice(${dice.id})"></div>`;
                } else {
                    html += `<div class="empty-cell"><i class="fas fa-circle" style="font-size:20px; opacity:0.3;"></i></div>`;
                }
            }
        }
        
        gridContainer.innerHTML = html;
        
        diceGridData.forEach(dice => {
            const cellId = `dice-cell-${dice.id}`;
            const cell = document.getElementById(cellId);
            if (cell) {
                initDice3D(cellId, dice);
            }
        });
        
        updateTotalSum();
    }
    
    window.addDiceToGrid = (type, sides, color) => {
        const result = Math.floor(Math.random() * sides) + 1;
        
        const newDice = {
            id: nextDiceId++,
            type: type,
            sides: sides,
            color: color,
            value: result,
            isRolling: true,
            result: result
        };
        
        diceGridData.push(newDice);
        renderGrid();
        
        let frames = 0;
        const maxFrames = 32;
        let rollInterval = setInterval(() => {
            if (frames >= maxFrames) {
                clearInterval(rollInterval);
                
                const dice = diceGridData.find(d => d.id === newDice.id);
                if (dice) {
                    dice.isRolling = false;
                    
                    const cell = document.getElementById(`dice-cell-${dice.id}`);
                    if (cell) cell.classList.remove('rolling');
                    
                    const sceneData = scenes.get(dice.id);
                    if (sceneData && sceneData.numberLabel) {
                        sceneData.numberLabel.innerText = dice.result;
                        sceneData.numberLabel.style.animation = 'none';
                        sceneData.numberLabel.offsetHeight;
                        sceneData.numberLabel.style.animation = 'numberPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                    }
                    
                    updateTotalSum();
                    addLog('d' + dice.sides, dice.result);
                }
            } else {
                const randomVal = Math.floor(Math.random() * sides) + 1;
                const sceneData = scenes.get(newDice.id);
                if (sceneData && sceneData.numberLabel) {
                    sceneData.numberLabel.innerText = randomVal;
                }
                frames++;
            }
        }, 38);
    };
    
    window.removeDice = (id) => {

    // Funções de HP e combate
    window.updateHP = (id, playSound = true) => {
        const card = document.getElementById(id);
        const max = parseInt(document.getElementById(`max-${id}`).value) || 1;
        let cur = window.HeroState[id];
        if(cur > max) cur = max;
        
        const pct = (cur / max) * 100;
        const barFill = document.getElementById(`bar-${id}`);
        
        barFill.style.width = Math.max(0, pct) + "%";
        document.getElementById(`txt-${id}`).innerText = `${cur} / ${max}`;

        if(pct > 50) barFill.style.backgroundColor = "var(--success)";
        else if(pct > 25) barFill.style.backgroundColor = "var(--warn)";
        else barFill.style.backgroundColor = "var(--danger)";

        if(cur <= 0) {
            if(!card.classList.contains('dead')) {
                card.classList.add('dead');
                if(playSound) document.getElementById('death-sound').play().catch(()=>{});
            }
        } else {
            card.classList.remove('dead');
        }
    };

            let c = window.HeroState[id];

                c += parseInt(v) || 0; 
            } else {
                c = parseInt(v) || c;
            }
            
            window.HeroState[id] = c; 
            updateHP(id, true); 
            e.target.value = "";
        }
    };

                    c: formulaInput ? formulaInput.value : "1d6",
                    t: s.querySelector('.s-t').value, 
                    d: s.querySelector('.s-d').value
                });
            });
            
            const inventory = []; 
            c.querySelectorAll('#inv-list-'+c.id+' .list-item').forEach(i => inventory.push({
                n: i.querySelector('.i-n').value, 
                q: i.querySelector('.i-q').value, 
                d: i.querySelector('.i-d').value
            }));
            
            const attrs = []; 
            c.querySelectorAll('.i-attr').forEach(i => attrs.push(i.value));
            
            const rb = []; 
            c.querySelectorAll('.i-rb').forEach(i => rb.push(i.value));
            
            data.push({ 
                id: c.id, 
                name: c.querySelector('.i-name').value, 
                race: c.querySelector('.i-race').value, 
                max: c.querySelector('.i-max').value, 
                cur: window.HeroState[c.id], 
                img: c.querySelector('.img-thumb').src, 
                attrs, 
                rb, 
                skills, 
                inventory 
            });
        });
        localStorage.setItem('nexus_3d_grid_v5', JSON.stringify(data));
        alert("✅ Sessão Salva com Sucesso!");
    };
    
    window.loadAll = () => {
        const saved = localStorage.getItem('nexus_3d_grid_v5');
        if(saved) {
            document.getElementById('hero-list').innerHTML = '';
            JSON.parse(saved).reverse().forEach(d => addNewHero(d));
            alert("📀 Personagens carregados!");
        } else {
            alert("ℹ️ Nenhum save encontrado.");
        }
    };
    
    // Inicializa
    renderGrid();
    
    const saved = localStorage.getItem('nexus_3d_grid_v5');
    if(saved) {
        JSON.parse(saved).reverse().forEach(d => addNewHero(d));
    }
</script>
</body>
</html>
